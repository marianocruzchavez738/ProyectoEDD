[project]
name = "edd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "marianocruzchavez738@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "osmium>=4.3.2",
    "osmnx>=2.1.1",
